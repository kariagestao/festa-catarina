<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Memórias - 15 Anos Catarina</title>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #FDE8EF; font-family: 'Cinzel', serif; color: #7A4F0E; }
        
        .mural-container { padding: 24px 16px; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; text-align: center; min-height: 100vh; }
        
        .section-title { font-size: 2rem; color: #cd0277; font-weight: 600; margin-bottom: 0.4rem; letter-spacing: 0.05em; }
        .section-sub { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.1rem; color: #9B6B1A; margin-bottom: 25px; }
        
        .file-input-wrapper { background: #cd0277; color: white; padding: 14px 28px; border-radius: 25px; cursor: pointer; display: inline-block; width: 100%; max-width: 280px; font-weight: bold; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; text-align: center; border: none; box-shadow: 0 4px 12px rgba(205,2,119,0.25); margin-bottom: 25px; }
        .file-input-wrapper input { display: none; }
        
        /* Grid em estilo Instagram / Explorar com colunas responsivas */
        .mural-grid { 
            width: 100%; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 15px; 
            margin: 20px auto; 
            padding: 0 5px; 
        }

        @media (min-width: 600px) {
            .mural-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 20px;
            }
        }

        .mural-post { background: white; border-radius: 12px; border: 1px solid rgba(200,150,62,0.25); overflow: hidden; box-shadow: 0 6px 16px rgba(0,0,0,0.04); width: 100%; text-align: left; }
        .mural-photo { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
        .mural-footer { padding: 12px 14px; font-family: 'Playfair Display', serif; font-size: 13px; color: #7A4F0E; border-top: 1px solid #f9f0f3; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <div class="mural-container">
        <h2 class="section-title" style="margin-top: 10px;">Mural da Catarina</h2>
        <p class="section-sub">Compartilhe suas fotos e memórias ao vivo!</p>
        
        <label class="file-input-wrapper">
            📸 Enviar Minha Foto
            <input type="file" accept="image/*" onchange="uploadFotoMuralConvidado(this)">
        </label>
        
        <p id="upload-status" style="font-family:'Playfair Display'; font-style: italic; color:#9B6B1A; margin-bottom: 15px;"></p>
        
        <div class="mural-grid" id="mural-lista-fotos"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
