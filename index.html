<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15 Anos de Catarina - Telão</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- SDK Oficial do Supabase -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #cd0277; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Cinzel', serif; }
        
        #view-telao { 
            width: 100vw; 
            height: 100vh; 
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #telao-arte-fundo-real {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            z-index: 1;
        }
        
        #telao-container-midia { 
            display: none; 
            position: absolute; 
            inset: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 3; 
            background: #FDE8EF; 
        }
        
        #telao-canvas { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        /* Legenda Rosa Bebê ajustada milimetricamente para baixo do "15 anos" */
        .telao-badge-momento { 
            display: none; 
            background: #FDE8EF; 
            border: 1px solid rgba(200,150,62,0.4); 
            padding: 14px 45px; 
            border-radius: 30px; 
            font-size: 1.4rem; 
            font-weight: 600;
            letter-spacing: 0.1em; 
            color: #cd0277; 
            align-items: center; 
            justify-content: center;
            gap: 15px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.2); 
            z-index: 5; 
            text-transform: uppercase; 
            position: absolute;
            top: 64%; 
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            white-space: nowrap;
        }
        .telao-badge-momento::before, .telao-badge-momento::after { content: "✦"; color: #C8963E; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div id="view-telao">
        <img id="telao-arte-fundo-real" src="arte-festa.jpg" alt="Arte de Fundo">
        <div id="telao-container-midia">
            <img id="telao-canvas" src="" alt="Slideshow">
        </div>
        <div class="telao-badge-momento" id="telao-subtitulo">RECEPÇÃO DOS CONVIDADOS</div>
    </div>

    <!-- Script unificado que controlará a inteligência -->
    <script src="script.js"></script>
</body>
</html>
