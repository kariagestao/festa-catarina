<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15 Anos de Catarina</title>
<link href="https://googleapis.com" rel="stylesheet">
<script src="https://jsdelivr.net"></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#cd0277; min-height:100vh; font-family:Cinzel,serif; color: #7A4F0E; overflow-x: hidden; }
.view-mode { display: none; width: 100%; min-height: 100vh; }
.view-mode.active { display: block; }

/* ================= DESIGN IDENTIDADE VISUAL DO TELÃO (BORDA INFINITA) ================= */
#view-telao { 
    background-color: #cd0277 !important; 
    width: 100vw; 
    height: 100vh; 
    overflow: hidden; 
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding: 0 0 8vh 0;
}
#telao-arte-fundo-real {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    z-index: 1;
}
#telao-container-midia { display: none; position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; background: #FDE8EF; }
#telao-canvas { width: 100%; height: 100%; object-fit: cover; }
.telao-badge-momento { display: none; background: #ffffff; border: 1px solid rgba(200,150,62,0.4); padding: 14px 40px; border-radius: 30px; font-family: Cinzel, serif; font-size: 1.4rem; letter-spacing: 0.15em; color: #cd0277; align-items: center; gap: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 5; text-transform: uppercase; }
.telao-badge-momento::before, .telao-badge-momento::after { content: "✦"; color: #cd0277; font-size: 1.1rem; }

/* ================= DESIGN PROFISSONAL DA TORRE DE COMANDO (LIMPO E SEM IMAGEM DE FUNDO) ================= */
#view-controle { background: #FDE8EF !important; } /* Força o fundo a ser rosa claro para leitura na portaria */
#controls { display:flex; flex-direction:column; align-items:center; padding:24px; min-height:100vh; text-align: center; width: 100%; }
.mode-nav, .moment-btns { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; justify-content:center; width: 100%; max-width: 800px; }
.mode-btn, .moment-btn { background:#ffffff; border:1px solid rgba(200,150,62,0.5); color:#9B6B1A; padding:10px 20px; border-radius:20px; font-family:Cinzel,serif; font-size:12px; cursor:pointer; letter-spacing:0.05em; transition:all 0.3s; text-transform: uppercase; font-weight: 600; }
.mode-btn:hover, .mode-btn.active, .moment-btn:hover, .moment-btn.active { background:rgba(200,150,62,0.15); border-color:#C8963E; color:#7A4F0E; box-shadow: 0 2px 8px rgba(200,150,62,0.1); }
.freeze-bar { display:flex; justify-content:center; margin-bottom:20px; width: 100%; }
.freeze-btn { background:#ffffff; border:1px solid rgba(210,3,119,0.4); color:#cd0277; padding:10px 24px; border-radius:20px; font-family:Cinzel,serif; font-size:12px; cursor:pointer; letter-spacing:0.08em; transition:all 0.3s; text-transform: uppercase; font-weight: bold; }
.freeze-btn.frozen { background:#cd0277; color:#ffffff; }
.screen { display:none; flex-direction:column; align-items:center; text-align:center; width:100%; background: #FDE8EF; }
.screen.active { display:flex; }
.section-title { font-family:Cinzel,serif; font-size:1.8rem; color:#cd0277; font-weight:600; margin-bottom:0.4rem; letter-spacing: 0.05em; }
.section-sub { font-family:'Playfair Display',serif; font-style:italic; font-size:1.1rem; color:#9B6B1A; margin-bottom:1.5rem; }
.photo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; width:100%; max-width:680px; margin-bottom:15px; }
.photo-slot { aspect-ratio:1; border-radius:6px; border:1px dashed rgba(200,150,62,0.4); background:rgba(200,150,62,0.04); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:#9B6B1A; font-family:Cinzel,serif; font-size:11px; cursor:pointer; transition:all 0.3s; position:relative; overflow:hidden; }
.photo-slot img { width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
.remove-btn { position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:rgba(180,0,0,0.8); border:none; color:#fff; font-size:11px; cursor:pointer; z-index:5; display:flex; align-items:center; justify-content:center; }
.crono-list, .convidados-list, .desafio-queue { width:100%; max-width:680px; display:flex; flex-direction:column; gap:8px; margin-bottom: 15px; }
.crono-item, .convidado-item, .desafio-item { display:flex; align-items:center; gap:14px; background:#ffffff; border:1px solid rgba(200,150,62,0.3); border-radius:8px; padding:14px 18px; cursor:pointer; transition: 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
.crono-item.done, .convidado-item.presente { background:rgba(0,130,0,0.06); border-color:rgba(0,130,0,0.3); }
.crono-check, .conv-check { width:24px; height:24px; border-radius:50%; border:2px solid rgba(200,150,62,0.6); display:flex; align-items:center; justify-content:center; font-size:12px; color:transparent; font-weight: bold; }
.crono-item.done .crono-check, .convidado-item.presente .conv-check { background:#008200; border-color:#008200; color:#fff; }
.crono-hora { font-family:Cinzel,serif; font-size:13px; color:#C8963E; font-weight:600; min-width:55px; }
.crono-texto, .conv-nome, .desafio-text { font-family:'Playfair Display',serif; font-size:14px; color:#7A4F0E; text-align:left; flex:1; }
.crono-item.done .crono-texto { text-decoration:line-through; color:#aaa; }
.crono-add { display:flex; gap:10px; width:100%; max-width:680px; margin-bottom: 15px; }
.crono-input { font-family:Cinzel,serif; font-size:12px; border:1px solid rgba(200,150,62,0.4); border-radius:20px; padding:10px 18px; flex:1; background:#ffffff; outline:none; color: #7A4F0E; }
.crono-hora-input { font-family:Cinzel,serif; font-size:12px; border:1px solid rgba(200,150,62,0.4); border-radius:20px; padding:10px 12px; width:90px; background:#ffffff; text-align:center; outline:none; color: #7A4F0E; }
.action-btn { background:#cd0277; border:none; color:#ffffff; padding:10px 24px; border-radius:24px; font-family:Cinzel,serif; font-size:12px; cursor:pointer; font-weight: 600; box-shadow: 0 2px 6px rgba(205,2,119,0.2); }
.conv-del { background:none; border:none; color:rgba(180,0,0,0.5); font-size:16px; cursor:pointer; padding: 0 6px; }
.desafio-thumb { width:46px; height:46px; border-radius:4px; object-fit:cover; border:1px solid rgba(200,150,62,0.3); }
.guest-container { padding: 30px 20px; text-align: center; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; background: #FDE8EF; min-height: 100vh; }
.select-desafio { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #C8963E; font-family: Cinzel, serif; margin-bottom: 15px; background: #fff; color: #7A4F0E; outline: none; }
.file-input-wrapper { background: #cd0277; color: white; padding: 12px 24px; border-radius: 25px; cursor: pointer; display: inline-block; width: 100%; max-width: 280px; font-weight: bold; margin-top: 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; border: none; text-align: center; }
.file-input-wrapper input { display: none; }
.pill { font-family:Cinzel,serif; font-size:12px; color:#7A4F0E; letter-spacing:0.08em; margin-top:12px; border:1px solid rgba(200,150,62,0.35); padding:8px 20px; border-radius:20px; background:#ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
</style>
</head>
<body>

<!-- ================= MODO 1: TELÃO OFICIAL ================= -->
<div id="view-telao" class="view-mode">
    <img id="telao-arte-fundo-real" src="arte-festa.jpg" alt="Arte de Fundo Oficial">
    <div id="telao-container-midia">
        <img id="telao-canvas" src="" alt="Slideshow">
    </div>
    <div class="telao-badge-momento" id="telao-subtitulo">RECEPÇÃO DOS CONVIDADOS</div>
</div>
<!-- ================= MODO 2: PAINEL DE CONTROLE (TORRE DE COMANDO PORTARIA) ================= -->
<div id="view-controle" class="view-mode">
    <div id="controls">
        <div class="mode-nav">
            <button class="mode-btn active" onclick="switchScreen('telao-manager')">Telão</button>
            <button class="mode-btn" onclick="switchScreen('fotos')">Fotos Cat</button>
            <button class="mode-btn" onclick="switchScreen('desafios')">Desafios</button>
            <button class="mode-btn" onclick="switchScreen('cronograma')">Cronograma</button>
            <button class="mode-btn" onclick="switchScreen('convidados')">Convidados</button>
        </div>

        <div class="freeze-bar">
            <button id="btn-congelar" class="freeze-btn" onclick="toggleCongelar()">Congelar Telão: OFF</button>
        </div>

        <div id="screen-telao-manager" class="screen active">
            <h2 class="section-title">Selecione o Momento para Projetar</h2>
            <p class="section-sub">Altere a legenda inferior do telão em tempo real</p>
            <div class="moment-btns">
                <button class="moment-btn" onclick="setMomento('RECEPÇÃO DOS CONVIDADOS')">Recepção dos Convidados</button>
                <button class="moment-btn" onclick="setMomento('ENTRADA DA CATARINA')">Entrada da Catarina</button>
                <button class="moment-btn" onclick="setMomento('TROCA DE SAPATO')">Troca de Sapato</button>
                <button class="moment-btn" onclick="setMomento('VALSA')">Valsa</button>
                <button class="moment-btn" onclick="setMomento('AGRADECIMENTOS ESPECIAIS')">Agradecimentos Especiais</button>
                <button class="moment-btn" onclick="setMomento('PARABÉNS')">Parabéns</button>
                <button class="moment-btn" onclick="setMomento('ABERTURA DA PISTA DE DANÇA')">Abertura da Pista</button>
                <button class="moment-btn" onclick="setMomento('Só a Arte')">Só a Arte</button>
            </div>
        </div>

        <div id="screen-fotos" class="screen">
            <h2 class="section-title">Fotos de Crescimento</h2>
            <div class="photo-grid" id="grid-fotos-cat"></div>
            <label class="file-input-wrapper" style="max-width:200px; font-size:11px; background: #C8963E;">
                + Enviar Nova Foto
                <input type="file" accept="image/*" onchange="uploadFotoCat(this)">
            </label>
        </div>

        <div id="screen-desafios" class="screen">
            <h2 class="section-title">Fotos dos Desafios</h2>
            <div class="desafio-queue" id="lista-desafios-stream"></div>
        </div>

        <div id="screen-cronograma" class="screen">
            <h2 class="section-title">Cronograma da Festa</h2>
            <div class="crono-list" id="cronograma-lista"></div>
            <div class="crono-add">
                <input type="text" class="crono-hora-input" id="crono-novo-horario" placeholder="22:30">
                <input type="text" class="crono-input" id="crono-novo-texto" placeholder="Momento...">
                <button class="action-btn" onclick="adicionarCronograma()">+</button>
            </div>
        </div>

        <div id="screen-convidados" class="screen">
            <h2 class="section-title">Lista de Convidados</h2>
            <div class="convidados-list" id="convidados-lista"></div>
            <div class="crono-add">
                <input type="text" class="crono-input" id="conv-novo-nome" placeholder="Nome do Convidado...">
                <button class="action-btn" onclick="adicionarConvidado()">+</button>
            </div>
            <div class="pill" id="conv-contador">Presentes: 0</div>
        </div>
    </div>
</div>

<!-- ================= MODO 3: INTERFACE DO CONVIDADO (QR CODE) ================= -->
<div id="view-convidado" class="view-mode">
    <div class="guest-container">
        <h2 class="section-title" style="font-size:2rem; margin-top: 20px;">15 Anos de Catarina</h2>
        <p class="section-sub">Compartilhe suas memórias!</p>
        <select class="select-desafio" id="guest-escolha-desafio">
            <option value="Memória Livre">Foto Livre (Memória da Festa)</option>
            <option value="Desafio 1">Desafio: Foto com a Debutante</option>
            <option value="Desafio 2">Desafio: Foto na Mesa de Doces</option>
            <option value="Desafio 3">Desafio: Careta na Pista de Dança</option>
        </select>
        <label class="file-input-wrapper">
            📸 Tirar ou Escolher Foto
            <input type="file" accept="image/*" onchange="uploadFotoConvidado(this)">
        </label>
        <p id="upload-status" style="margin-top:20px; font-family:'Playfair Display'; font-style: italic; color:#9B6B1A;"></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
