<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel de Controle - Festa</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f4f6f9; padding: 20px; color: #333; }
    h1 { text-align: center; margin-bottom: 20px; color: #b76e79; }
    .card-painel { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .card-painel h3 { margin-bottom: 15px; color: #444; border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; }
    .btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 15px; }
    button { padding: 12px; border: none; border-radius: 8px; background: #b76e79; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { opacity: 0.9; }
    #btn-congelar { background: #dc3545; }
    #btn-congelar.frozen { background: #ffc107; color: #000; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 10px; }
    .photo-slot { position: relative; width: 100%; height: 100px; border-radius: 8px; overflow: hidden; background: #ddd; }
    .photo-slot img { width: 100%; height: 100%; object-fit: cover; }
    .remove-btn { position: absolute; top: 5px; right: 5px; background: rgba(255,0,0,0.8); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    input, textarea, select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px; }
    textarea { resize: vertical; min-height: 80px; }
    .convidado-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #fafafa; border-radius: 6px; margin-bottom: 8px; border-left: 4px solid #ccc; cursor: pointer; }
    .convidado-item.presente { border-left-color: #28a745; background: #f0fff4; }
    .conv-del { background: #ff4d4d; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  </style>
</head>
<body>

  <h1>Torre de Comando - Festa 🎉</h1>

  <div class="card-painel">
    <h3>Controle do Telão</h3>
    <button id="btn-congelar" onclick="toggleCongelar()" style="width:100%; margin-bottom: 15px;">CONGELAR TELÃO: OFF</button>
    <div class="btn-grid">
      <button onclick="setMomento('RECEPÇÃO DOS CONVIDADOS')">Recepção</button>
      <button onclick="setMomento('SLIDESHOW DA CATARINA')">Slideshow Catarina</button>
      <button onclick="setMomento('SLIDESHOW DOS DESAFIOS')">Slideshow Desafios</button>
      <button onclick="setMomento('RETROSPECTIVA')">Retrospectiva</button>
      <button onclick="setMomento('PARABÉNS E BOLO')">Parabéns e Bolo</button>
      <button onclick="setMomento('PISTA DE DANÇA')">Pista de Dança</button>
    </div>
  </div>

  <div class="card-painel">
    <h3>Cronograma & Observações</h3>
    <input type="text" id="crono-novo-horario" placeholder="Horário (Ex: 20:00)">
    <input type="text" id="crono-novo-titulo" placeholder="Título (Ex: Entrada dos Noivos)">
    <textarea id="crono-novo-texto" placeholder="Cole aqui seu texto ou observações para falar..."></textarea>
    <button onclick="adicionarCronograma()">Adicionar ao Cronograma</button>
    <div id="cronograma-lista" style="margin-top: 15px;"></div>
  </div>

  <div class="card-painel">
    <h3>Fotos da Catarina (Slideshow Separado)</h3>
    <input type="file" accept="image/*" onchange="uploadFotoCat(this)">
    <div id="grid-fotos-cat" class="photo-grid"></div>
  </div>

  <div class="card-painel">
    <h3>Desafios dos Convidados</h3>
    <select id="admin-escolha-desafio">
      <option value="Selfie com a Aniversariante">Selfie com a Aniversariante</option>
      <option value="Brindando à Noite">Brindando à Noite</option>
      <option value="Na Pista de Dança">Na Pista de Dança</option>
    </select>
    <input type="file" accept="image/*" onchange="uploadFotoDesafioAdmin(this)">
    <div id="admin-upload-status" style="font-size: 13px; color: #666; margin-bottom: 10px;"></div>
    <div id="lista-desafios-stream"></div>
  </div>

  <div class="card-painel">
    <h3>Lista de Convidados</h3>
    <div id="conv-contador" style="margin-bottom: 10px; font-weight: bold; color: #b76e79;"></div>
    <input type="text" id="conv-novo-nome" placeholder="Nome do Convidado">
    <button onclick="adicionarConvidado()">Adicionar Convidado</button>
    <div id="convidados-lista" style="margin-top: 15px;"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
